name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: The tag is the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          crate=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "v$crate" != "$TAG" ]; then
            echo "Cargo.toml says $crate and the tag says $TAG" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      # crates.io hands a token to this workflow only once the repository is
      # configured for Trusted Publishing there; until then the step is
      # allowed to fail and the crates go out from a maintainer's machine.
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
        continue-on-error: true
      # rfc9162-tiles requires rfc9162 at this version and rfc9162-log
      # requires both, so they go in that order. A version already on
      # crates.io is skipped, so a run that failed between two can be
      # started again.
      - name: No Trusted Publishing configuration
        if: steps.auth.outcome != 'success'
        run: echo "crates.io gave no token for this repository; publish by hand with cargo publish --locked -p CRATE" >&2
      - name: Publish rfc9162, rfc9162-tiles, then rfc9162-log
        if: steps.auth.outcome == 'success'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          for p in rfc9162 rfc9162-tiles rfc9162-log; do
            if cargo info --registry crates-io "$p@$version" >/dev/null 2>&1; then
              echo "$p $version is on crates.io already"
              continue
            fi
            cargo publish --locked -p "$p"
          done
