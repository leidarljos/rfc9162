<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="con cond">
  <title id="con">Consistency proof from size 4 to size 7</title>
  <desc id="cond">The old tree is the left subtree of four leaves. Its root is already known, so the proof carries the root of the subtree over leaves 4, 5 and 6.</desc>
  <style>
    .edge { stroke: #8aa0ad; stroke-width: 1.5; fill: none; }
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2b33; text-anchor: middle; font-size: 14px; }
    .old { fill: #f4f8fb; stroke: #6d8794; }
    .proof { fill: #e5f4fb; stroke: #0b6e99; stroke-width: 2; }
    .leaf { fill: #ffffff; stroke: #6d8794; }
    .cap { font-size: 13px; fill: #0b6e99; font-weight: 650; }
    .quiet { font-size: 13px; fill: #3d5560; }
  </style>
  <rect x="24" y="96" width="500" height="290" rx="10" fill="#f7fafc" stroke="#d5e2ea"/>
  <text class="quiet" x="274" y="86">old tree, size 4, root already held</text>
  <line class="edge" x1="520" y1="52" x2="274" y2="130"/>
  <line class="edge" x1="520" y1="52" x2="760" y2="130"/>
  <line class="edge" x1="274" y1="166" x2="150" y2="230"/>
  <line class="edge" x1="274" y1="166" x2="400" y2="230"/>
  <line class="edge" x1="150" y1="266" x2="100" y2="330"/>
  <line class="edge" x1="150" y1="266" x2="200" y2="330"/>
  <line class="edge" x1="400" y1="266" x2="350" y2="330"/>
  <line class="edge" x1="400" y1="266" x2="450" y2="330"/>
  <line class="edge" x1="760" y1="166" x2="700" y2="230"/>
  <line class="edge" x1="760" y1="166" x2="830" y2="230"/>
  <line class="edge" x1="700" y1="266" x2="660" y2="330"/>
  <line class="edge" x1="700" y1="266" x2="740" y2="330"/>
  <rect class="old" x="450" y="16" width="140" height="36" rx="6"/>
  <text x="520" y="39">[0, 7)</text>
  <rect class="old" x="204" y="130" width="140" height="36" rx="6"/>
  <text x="274" y="153">[0, 4)</text>
  <rect class="proof" x="690" y="130" width="140" height="36" rx="6"/>
  <text x="760" y="153">[4, 7)</text>
  <text class="cap" x="760" y="120">the proof node</text>
  <rect class="old" x="80" y="230" width="140" height="36" rx="6"/>
  <text x="150" y="253">[0, 2)</text>
  <rect class="old" x="330" y="230" width="140" height="36" rx="6"/>
  <text x="400" y="253">[2, 4)</text>
  <rect class="leaf" x="50" y="330" width="100" height="36" rx="6"/>
  <text x="100" y="353">leaf 0</text>
  <rect class="leaf" x="150" y="330" width="100" height="36" rx="6"/>
  <text x="200" y="353">leaf 1</text>
  <rect class="leaf" x="300" y="330" width="100" height="36" rx="6"/>
  <text x="350" y="353">leaf 2</text>
  <rect class="leaf" x="400" y="330" width="100" height="36" rx="6"/>
  <text x="450" y="353">leaf 3</text>
  <rect class="proof" x="640" y="230" width="120" height="36" rx="6"/>
  <text x="700" y="253">[4, 6)</text>
  <rect class="proof" x="790" y="230" width="90" height="36" rx="6"/>
  <text x="835" y="253">leaf 6</text>
  <rect class="proof" x="610" y="330" width="90" height="36" rx="6"/>
  <text x="655" y="353">leaf 4</text>
  <rect class="proof" x="710" y="330" width="90" height="36" rx="6"/>
  <text x="755" y="353">leaf 5</text>
</svg>
