<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="inc incd">
  <title id="inc">Inclusion proof for leaf 1 in a tree of seven</title>
  <desc id="incd">The proof carries leaf 0, the subtree of leaves 2 and 3, and the subtree of leaves 4 through 6, innermost first.</desc>
  <style>
    .edge { stroke: #c5d3dc; stroke-width: 1.5; fill: none; }
    .hot { stroke: #0b6e99; stroke-width: 1.8; fill: none; }
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2b33; text-anchor: middle; font-size: 14px; }
    .box { fill: #f7fafc; stroke: #c5d3dc; }
    .leaf { fill: #ffffff; stroke: #c5d3dc; }
    .hi { fill: #e5f4fb; stroke: #0b6e99; stroke-width: 2; }
    .tag { font-size: 12px; fill: #0b6e99; font-weight: 650; }
  </style>
  <line class="edge" x1="520" y1="52" x2="280" y2="120"/>
  <line class="hot" x1="520" y1="52" x2="760" y2="120"/>
  <line class="edge" x1="280" y1="156" x2="150" y2="220"/>
  <line class="hot" x1="280" y1="156" x2="410" y2="220"/>
  <line class="edge" x1="760" y1="156" x2="670" y2="220"/>
  <line class="edge" x1="760" y1="156" x2="850" y2="220"/>
  <line class="hot" x1="150" y1="256" x2="90" y2="340"/>
  <line class="hot" x1="150" y1="256" x2="210" y2="340"/>
  <line class="edge" x1="410" y1="256" x2="350" y2="340"/>
  <line class="edge" x1="410" y1="256" x2="470" y2="340"/>
  <line class="edge" x1="670" y1="256" x2="610" y2="340"/>
  <line class="edge" x1="670" y1="256" x2="730" y2="340"/>
  <rect class="box" x="450" y="16" width="140" height="36" rx="6"/>
  <text x="520" y="39">root</text>
  <rect class="box" x="210" y="120" width="140" height="36" rx="6"/>
  <text x="280" y="143">[0, 4)</text>
  <rect class="hi" x="690" y="120" width="140" height="36" rx="6"/>
  <text x="760" y="143">[4, 7)</text>
  <text class="tag" x="760" y="112">sibling 3</text>
  <rect class="box" x="80" y="220" width="140" height="36" rx="6"/>
  <text x="150" y="243">[0, 2)</text>
  <rect class="hi" x="340" y="220" width="140" height="36" rx="6"/>
  <text x="410" y="243">[2, 4)</text>
  <text class="tag" x="410" y="276">sibling 2</text>
  <rect class="box" x="600" y="220" width="140" height="36" rx="6"/>
  <text x="670" y="243">[4, 6)</text>
  <rect class="leaf" x="800" y="220" width="100" height="36" rx="6"/>
  <text x="850" y="243">leaf 6</text>
  <rect class="hi" x="40" y="340" width="100" height="36" rx="6"/>
  <text x="90" y="363">leaf 0</text>
  <text class="tag" x="90" y="396">sibling 1</text>
  <rect class="hi" x="160" y="340" width="100" height="36" rx="6"/>
  <text x="210" y="363">leaf 1</text>
  <text class="tag" x="210" y="396">proved leaf</text>
  <rect class="leaf" x="300" y="340" width="100" height="36" rx="6"/>
  <text x="350" y="363">leaf 2</text>
  <rect class="leaf" x="420" y="340" width="100" height="36" rx="6"/>
  <text x="470" y="363">leaf 3</text>
  <rect class="leaf" x="560" y="340" width="100" height="36" rx="6"/>
  <text x="610" y="363">leaf 4</text>
  <rect class="leaf" x="680" y="340" width="100" height="36" rx="6"/>
  <text x="730" y="363">leaf 5</text>
</svg>
