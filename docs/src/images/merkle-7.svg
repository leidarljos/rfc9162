<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="m7 m7d">
  <title id="m7">Merkle tree of seven leaves</title>
  <desc id="m7d">The tree splits at the largest power of two below its width. Seven leaves split into a subtree of four and a subtree of three. The subtree of three splits into a pair and the last leaf.</desc>
  <style>
    .edge { stroke: #8aa0ad; stroke-width: 1.5; fill: none; }
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2b33; text-anchor: middle; font-size: 14px; }
    .box { fill: #f4f8fb; stroke: #6d8794; }
    .leaf { fill: #ffffff; stroke: #6d8794; }
  </style>
  <line class="edge" x1="520" y1="52" x2="280" y2="110"/>
  <line class="edge" x1="520" y1="52" x2="760" y2="110"/>
  <line class="edge" x1="280" y1="146" x2="150" y2="210"/>
  <line class="edge" x1="280" y1="146" x2="410" y2="210"/>
  <line class="edge" x1="760" y1="146" x2="670" y2="210"/>
  <line class="edge" x1="760" y1="146" x2="850" y2="210"/>
  <line class="edge" x1="150" y1="246" x2="90" y2="330"/>
  <line class="edge" x1="150" y1="246" x2="210" y2="330"/>
  <line class="edge" x1="410" y1="246" x2="350" y2="330"/>
  <line class="edge" x1="410" y1="246" x2="470" y2="330"/>
  <line class="edge" x1="670" y1="246" x2="610" y2="330"/>
  <line class="edge" x1="670" y1="246" x2="730" y2="330"/>
  <rect class="box" x="450" y="16" width="140" height="36" rx="6"/>
  <text x="520" y="39">[0, 7)</text>
  <rect class="box" x="210" y="110" width="140" height="36" rx="6"/>
  <text x="280" y="133">[0, 4)</text>
  <rect class="box" x="690" y="110" width="140" height="36" rx="6"/>
  <text x="760" y="133">[4, 7)</text>
  <rect class="box" x="80" y="210" width="140" height="36" rx="6"/>
  <text x="150" y="233">[0, 2)</text>
  <rect class="box" x="340" y="210" width="140" height="36" rx="6"/>
  <text x="410" y="233">[2, 4)</text>
  <rect class="box" x="600" y="210" width="140" height="36" rx="6"/>
  <text x="670" y="233">[4, 6)</text>
  <rect class="leaf" x="800" y="210" width="100" height="36" rx="6"/>
  <text x="850" y="233">leaf 6</text>
  <rect class="leaf" x="40" y="330" width="100" height="36" rx="6"/>
  <text x="90" y="353">leaf 0</text>
  <rect class="leaf" x="160" y="330" width="100" height="36" rx="6"/>
  <text x="210" y="353">leaf 1</text>
  <rect class="leaf" x="300" y="330" width="100" height="36" rx="6"/>
  <text x="350" y="353">leaf 2</text>
  <rect class="leaf" x="420" y="330" width="100" height="36" rx="6"/>
  <text x="470" y="353">leaf 3</text>
  <rect class="leaf" x="560" y="330" width="100" height="36" rx="6"/>
  <text x="610" y="353">leaf 4</text>
  <rect class="leaf" x="680" y="330" width="100" height="36" rx="6"/>
  <text x="730" y="353">leaf 5</text>
</svg>
