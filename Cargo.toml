[workspace]
resolver = "2"
members = [
    "crates/rfc9162",
    "crates/rfc9162-tiles",
    "crates/rfc9162-log",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# The internal pin follows [workspace.package] version. cog writes this line.
# Change that version, then run `cog -r @cogfiles.txt`.
# [[[cog import versions; cog.out(versions.pins()) ]]]
rfc9162 = { path = "crates/rfc9162", version = "0.9.0" }
rfc9162-tiles = { path = "crates/rfc9162-tiles", version = "0.9.0" }
# [[[end]]]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
tempfile = "3"
miniz_oxide = "0.8"
