[package]
name = "rfc9162-log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/stackhands/rfc9162"
readme = "README.md"
description = "An authenticated, indexed, append-only log over rfc9162 and rfc9162-tiles: sorted runs whose manifests are logged, so a checkpoint signs the index"
keywords = ["merkle", "transparency", "log", "index", "sstable"]
categories = ["cryptography", "database-implementations"]

[dependencies]
rfc9162.workspace = true
rfc9162-tiles.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true

[[bin]]
name = "rfc9162-sidecar"
path = "src/bin/sidecar.rs"

[dev-dependencies]
tempfile.workspace = true
